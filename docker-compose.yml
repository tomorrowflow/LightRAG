services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightrag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lightrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightrag_password}
      POSTGRES_DB: ${POSTGRES_DB:-lightrag}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - lightrag_network
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightrag}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Main LightRAG Server with Web UI
  lightrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightrag
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      # Persistent storage
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/outputs:/app/data/outputs
      - ./data/tiktoken:/app/data/tiktoken
      # Configuration file (read by LightRAG server at /app/.env)
      - ./.env:/app/.env:ro
    # Load all settings from .env; only override Docker-specific networking below
    env_file:
      - .env
    environment:
      # Ollama runs on the host — rewrite localhost → host.docker.internal for container networking
      - LLM_BINDING_HOST=http://host.docker.internal:11434
      - EMBEDDING_BINDING_HOST=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_VISION_HOST=http://host.docker.internal:11434
      - RETRIEVAL_LLM_BINDING_HOST=http://host.docker.internal:11434
      # Container working paths
      - WORKING_DIR=/app/data/rag_storage
      - INPUT_DIR=/app/data/inputs

    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - lightrag_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: lightrag-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - ./data/neo4j_data:/data
      - ./data/neo4j_logs:/logs
    networks:
      - lightrag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lightrag-qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - lightrag_network
    ports:
      - "6334:6333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: lightrag-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lightrag_password}
    volumes:
      - redis_data:/data
    networks:
      - lightrag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph:
    image: memgraph/memgraph:latest
    container_name: lightrag-memgraph
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - lightrag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 0s


  mongodb:
    image: mongo:latest
    container_name: lightrag-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-lightrag}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-lightrag_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-lightrag}
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - lightrag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  vllm-reranker:
    image: vllm/vllm-openai:latest
    container_name: lightrag-vllm-reranker
    command:
      --model BAAI/bge-reranker-v2-m3
      --task score
      --gpu-memory-utilization 0.9
      --max-model-len 4096
    volumes:
      - ./vllm_cache:/root/.cache/huggingface
    networks:
      - lightrag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  lightrag_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  memgraph_data:
    driver: local
